name: Web Test

on:
  workflow_dispatch:
  push:
    branches:
      - is-al-sat-yeni

jobs:
  build-web:
    runs-on: ubuntu-latest

    steps:
      - name: Kodlari al
        uses: actions/checkout@v4

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Web projesini hazirla
        run: |
          if [ ! -f pubspec.yaml ] && [ -f Pubspec.yaml ]; then cp Pubspec.yaml pubspec.yaml; fi
          flutter create --platforms=web .
          flutter pub get

      - name: Gozat360 web ve PWA ayarlarini uygula
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import json, re, hashlib
          version = "v6"
          src_path = Path("gozat360_logo_v6.png")
          if not src_path.exists(): raise SystemExit("Gozat360 v6 logo kaynagi bulunamadi")
          expected="efd881b82693815ec64abd8e7bad4c05688308f0f902f9da7acf0d0973b0fc4c"
          actual=hashlib.sha256(src_path.read_bytes()).hexdigest()
          if actual!=expected: raise SystemExit(f"Yanlis logo dosyasi: {actual}")
          src = Image.open(src_path).convert("RGBA")
          def make_icon(size, path):
              img=src.copy(); img.thumbnail((size,size),Image.Resampling.LANCZOS)
              canvas=Image.new("RGBA",(size,size),(255,255,255,0)); canvas.alpha_composite(img,((size-img.width)//2,(size-img.height)//2)); canvas.save(path)
          Path("web/icons").mkdir(parents=True,exist_ok=True)
          make_icon(64,f"web/gozat360-favicon-{version}.png")
          make_icon(192,f"web/icons/gozat360-192-{version}.png")
          make_icon(512,f"web/icons/gozat360-512-{version}.png")
          make_icon(192,f"web/icons/gozat360-maskable-192-{version}.png")
          make_icon(512,f"web/icons/gozat360-maskable-512-{version}.png")
          p=Path("web/manifest.json"); m=json.loads(p.read_text())
          m.update({"id":"/?pwa=1","name":"Gözat360","short_name":"Gözat360","description":"İş ilanları ve ikinci el pazaryeri","start_url":"/?pwa=1","scope":"/","display":"standalone","background_color":"#F6F9FD","theme_color":"#F6F9FD"})
          m["icons"]=[{"src":f"icons/gozat360-192-{version}.png","sizes":"192x192","type":"image/png","purpose":"any"},{"src":f"icons/gozat360-512-{version}.png","sizes":"512x512","type":"image/png","purpose":"any"},{"src":f"icons/gozat360-maskable-192-{version}.png","sizes":"192x192","type":"image/png","purpose":"maskable"},{"src":f"icons/gozat360-maskable-512-{version}.png","sizes":"512x512","type":"image/png","purpose":"maskable"}]
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2))
          ip=Path("web/index.html"); html=ip.read_text(); verification='<meta name="google-site-verification" content="EWUth7I1bl5nzKh_Iymm5SSeVUfKw67A8K5RvIei3VA" />'
          if 'google-site-verification' not in html: html=html.replace('<head>','<head>\n  '+verification,1)
          html=re.sub(r'href="favicon\.png"',f'href="gozat360-favicon-{version}.png"',html)
          html=re.sub(r'href="icons/Icon-192\.png"',f'href="icons/gozat360-192-{version}.png"',html)
          ip.write_text(html)
          PY

      - name: Web surumunu olustur
        run: flutter build web --release

      - name: PWA paketini dogrula ve Firebase ayarini ekle
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('build/web/manifest.json').read_text())
          assert m.get('start_url')=='/?pwa=1', m.get('start_url')
          assert m.get('id')=='/?pwa=1', m.get('id')
          assert len(m.get('icons',[]))==4
          assert all('v6' in i['src'] for i in m['icons'])
          for i in m['icons']: assert Path('build/web',i['src']).exists(), i['src']
          assert Path('build/web/main.dart.js').stat().st_size > 100000
          src=Path('lib/web_ana_sayfa.dart').read_text()
          desktop=Path('lib/web_ana_sayfa_desktop.dart').read_text()
          assert "gozat360_logo_v6.png" in src
          assert "Container(height:72" in src
          assert "Container(height:62" in src
          assert "gozat360_logo_v6.png" in desktop
          print('PWA manifest, v6 doğru logo, mobil kart ölçüleri ve Flutter build dosyası doğrulandı.')
          PY
          cat > build/web/firebase.json <<'EOF'
          {"hosting":{"site":"gozat360web","public":".","ignore":["firebase.json",".firebaserc","**/.*","**/node_modules/**"],"headers":[{"source":"/index.html","headers":[{"key":"Cache-Control","value":"no-cache, no-store, must-revalidate"}]},{"source":"/manifest.json","headers":[{"key":"Cache-Control","value":"no-cache, no-store, must-revalidate"}]},{"source":"/flutter_bootstrap.js","headers":[{"key":"Cache-Control","value":"no-cache, no-store, must-revalidate"}]},{"source":"/flutter_service_worker.js","headers":[{"key":"Cache-Control","value":"no-cache, no-store, must-revalidate"}]},{"source":"/main.dart.js","headers":[{"key":"Cache-Control","value":"no-cache, must-revalidate"}]},{"source":"/icons/**","headers":[{"key":"Cache-Control","value":"public, max-age=31536000, immutable"}]}],"rewrites":[{"source":"**","destination":"/index.html"}]}}
          EOF
          cat > build/web/.firebaserc <<'EOF'
          {"projects":{"default":"is-bul-1652d"},"targets":{}}
          EOF
          cat > build/web/DEPLOY-TERMUX.txt <<'EOF'
          cd ~ && rm -rf gozat360-final && mkdir gozat360-final && unzip -o ~/storage/downloads/gozat360-web.zip -d gozat360-final && cd ~/gozat360-final && firebase deploy --only hosting
          EOF

      - name: Web dosyalarini yukle
        uses: actions/upload-artifact@v4
        with:
          name: gozat360-web
          path: build/web
          include-hidden-files: true
