name: Web Test

on:
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest

    steps:
      - name: Kodlari al
        uses: actions/checkout@v4

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Web projesini hazirla
        run: |
          if [ ! -f pubspec.yaml ] && [ -f Pubspec.yaml ]; then
            cp Pubspec.yaml pubspec.yaml
          fi
          flutter create --platforms=web .
          flutter pub get

      - name: Web surumunu olustur
        run: flutter build web --release

      - name: Web dosyalarini yukle
        uses: actions/upload-artifact@v4
        with:
          name: gozat360-web
          path: build/web
