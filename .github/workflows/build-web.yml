name: Web Test

on:
  workflow_dispatch:
  push:
    branches:
      - is-al-sat-yeni

jobs:
  build-web:
    runs-on: ubuntu-latest

    steps:
      - name: Kodlari al
        uses: actions/checkout@v4

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Web projesini hazirla
        run: |
          if [ ! -f pubspec.yaml ] && [ -f Pubspec.yaml ]; then
            cp Pubspec.yaml pubspec.yaml
          fi
          flutter create --platforms=web .
          flutter pub get

      - name: Gozat360 web ve PWA ayarlarini uygula
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import json, re

          src = Image.open("file_000000000640821098f7fc77265f38c8.png").convert("RGBA")

          def make_icon(size, path):
              img = src.copy()
              img.thumbnail((size, size), Image.Resampling.LANCZOS)
              canvas = Image.new("RGBA", (size, size), (255, 255, 255, 0))
              canvas.alpha_composite(img, ((size-img.width)//2, (size-img.height)//2))
              canvas.save(path)

          Path("web/icons").mkdir(parents=True, exist_ok=True)
          make_icon(64, "web/gozat360-favicon-v3.png")
          make_icon(192, "web/icons/gozat360-192-v3.png")
          make_icon(512, "web/icons/gozat360-512-v3.png")
          make_icon(192, "web/icons/gozat360-maskable-192-v3.png")
          make_icon(512, "web/icons/gozat360-maskable-512-v3.png")

          manifest_path = Path("web/manifest.json")
          manifest = json.loads(manifest_path.read_text())
          manifest["name"] = "Gözat360"
          manifest["short_name"] = "Gözat360"
          manifest["description"] = "İş ilanları ve ikinci el pazaryeri"
          manifest["start_url"] = "/?pwa=1"
          manifest["scope"] = "/"
          manifest["display"] = "standalone"
          manifest["icons"] = [
              {"src":"icons/gozat360-192-v3.png","sizes":"192x192","type":"image/png"},
              {"src":"icons/gozat360-512-v3.png","sizes":"512x512","type":"image/png"},
              {"src":"icons/gozat360-maskable-192-v3.png","sizes":"192x192","type":"image/png","purpose":"maskable"},
              {"src":"icons/gozat360-maskable-512-v3.png","sizes":"512x512","type":"image/png","purpose":"maskable"}
          ]
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2))

          index_path = Path("web/index.html")
          html = index_path.read_text()
          verification = '<meta name="google-site-verification" content="EWUth7I1bl5nzKh_Iymm5SSeVUfKw67A8K5RvIei3VA" />'
          if 'google-site-verification' not in html:
              html = html.replace('<head>', '<head>\n  ' + verification, 1)
          html = re.sub(r'href="favicon\.png"', 'href="gozat360-favicon-v3.png"', html)
          html = re.sub(r'href="icons/Icon-192\.png"', 'href="icons/gozat360-192-v3.png"', html)
          index_path.write_text(html)
          PY

      - name: Web surumunu olustur
        run: flutter build web --release

      - name: Web dosyalarini yukle
        uses: actions/upload-artifact@v4
        with:
          name: gozat360-web
          path: build/web
