name: APK Olustur

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodlari al
        uses: actions/checkout@v4

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Projeyi hazirla
        run: |
          if [ ! -f pubspec.yaml ] && [ -f Pubspec.yaml ]; then
            cp Pubspec.yaml pubspec.yaml
          fi
          rm -rf android
         
          flutter create --platforms=android .
          sed -i 's/android:label="[^"]*"/android:label="Gözat360"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/namespace = ".*"/namespace = "com.gozat360.app"/' android/app/build.gradle.kts
          sed -i 's/applicationId = ".*"/applicationId = "com.gozat360.app"/' android/app/build.gradle.kts
          find android/app/src/main/kotlin -name MainActivity.kt -exec sed -i 's/^package .*/package com.gozat360.app/' {} \;
          sed -i 's/-all.zip/-bin.zip/' android/gradle/wrapper/gradle-wrapper.properties
          flutter pub get

      - name: Debug anahtari olustur
        run: |
          mkdir -p ~/.android
          keytool -genkeypair \
            -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: SHA1 goster
        run: |
          keytool -list -v \
            -alias androiddebugkey \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -keypass android
      
        

      - name: APK olustur
        run: |
          for i in 1 2 3; do
            flutter build apk --release && exit 0
            if [ "$i" -lt 3 ]; then
              echo "Gradle indirme hatasi, 15 saniye sonra tekrar deneniyor..."
              sleep 15
            fi
          done
          exit 1
      - name: AAB olustur
        run: flutter build appbundle --release 

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: gozat360-apk
          
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: AAB yukle
     
        uses: actions/upload-artifact@v4
        with:
          name: gozat360-aab
          path: build/app/outputs/bundle/release/app-release.aab
